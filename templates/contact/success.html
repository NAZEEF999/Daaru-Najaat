{% extends "base.html" %}
{% block content %}
<section style="padding-top:8rem;padding-bottom:5rem;display:flex;align-items:center;justify-content:center;min-height:80vh;">
  <div class="glass-card" style="padding:3rem;border-radius:1.5rem;max-width:32rem;width:100%;margin:0 1rem;text-align:center;">
    <div style="width:4rem;height:4rem;border-radius:50%;background:rgba(58,125,68,.2);border:2px solid rgba(58,125,68,.4);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
      <svg style="width:2rem;height:2rem;color:#3A7D44;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
    </div>
    <h1 style="font-family:'Cormorant Garamond',serif;font-size:2rem;color:#D4E8D6;margin-bottom:.75rem;">Message Sent</h1>
    <p style="color:#A0B5A3;margin-bottom:2rem;">Thank you, <strong style="color:#E8F0E9;">{{ inquiry.name }}</strong>. We will get back to you shortly.</p>
    <div style="display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;">
      <a href="{% url 'api:home' %}" class="btn-primary">Back to Home</a>
      <a href="{% url 'api:book' %}" class="btn-ghost">Book a Session</a>
    </div>
  </div>
</section>
{% endblock %}
